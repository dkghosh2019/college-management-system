spring.application.name=College Management System Backend


# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# Database Configuration (PostgreSQL)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always


spring.datasource.url=jdbc:postgresql://localhost:5432/college_db
spring.datasource.username=college_user
spring.datasource.password=college_password

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration